name: latermark
description: "Fotoğraf çek, iki kelime yaz, unut."
publish_to: "none"
version: 1.0.3+11

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  cross_file: ^0.3.5+4
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # Upstream Android modeli özel tekrar süresini 32-bit `Integer` olarak
  # okuyor; 30 ve 365 gün gibi geçerli aralıklar bu sınırı aşıyor. Paket yerel
  # tutulup alan 64-bit'e çıkarıldı (bkz. vendored Java modelindeki not).
  flutter_local_notifications:
    path: third_party/flutter_local_notifications
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  home_widget: ^0.9.3
  intl: 0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter_file_dialog: ^3.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Yalnızca test için: satın alma servisinin mağaza dikişi bu arayüz.
  # `in_app_purchase` onu dışa aktarmıyor, sahte mağaza kurmanın başka yolu yok.
  in_app_purchase_platform_interface: ^1.4.0
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  # Yalnızca göç testi için: eski sürüm şemasını elle kurup uygulamanın o
  # veritabanını açmasını denemenin başka yolu yok.
  sqlite3: ^3.5.1

flutter:
  uses-material-design: true
  generate: true
